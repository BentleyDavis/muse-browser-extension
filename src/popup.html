<!DOCTYPE html>
<html>
<head><style>
body { width: 280px; padding: 16px; font-family: system-ui; }
h2 { margin: 0 0 12px; font-size: 16px; }
.status { padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; }
.connected { background: #e6f4ea; color: #137333; }
.disconnected { background: #fce8e6; color: #c5221f; }
button { width: 100%; padding: 8px; margin: 4px 0; cursor: pointer; }
.info { font-size: 12px; color: #666; margin-top: 12px; }
</style></head>
<body>
<h2>Muse Control</h2>
<div id="status" class="status disconnected">Not connected</div>
<button id="recordBtn">Start Recording Movements</button>
<button id="pingBtn">Ping</button>
<div class="info" id="info"></div>
<script src="popup.js"></script>
</body>
</html>
